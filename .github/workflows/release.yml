name: Release ReSync

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: Release Version
        required: true
        type: string
      channel:
        description: Release Channel
        required: true
        type: choice
        default: stable
        options: [stable, dev]
      visibility:
        description: Release Visibility
        required: true
        type: choice
        default: PUBLIC
        options: [PUBLIC, UNLISTED]
      changelog:
        description: Release Changelog
        required: false
        type: string
      publish_confirm:
        description: Type PUBLISH To Release
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.repository }}-${{ github.event.release.tag_name || inputs.version }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
      channel: ${{ steps.release.outputs.channel }}
      visibility: ${{ steps.release.outputs.visibility }}
      changelog: ${{ steps.release.outputs.changelog }}
      source_ref: ${{ steps.release.outputs.source_ref }}
      remotely_ref: ${{ steps.dependencies.outputs.remotely }}
      rescreen_ref: ${{ steps.dependencies.outputs.rescreen }}
      rebase_ref: ${{ steps.dependencies.outputs.rebase }}
    steps:
      - id: release
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_CHANNEL: ${{ inputs.channel }}
          INPUT_VISIBILITY: ${{ inputs.visibility }}
          INPUT_CHANGELOG: ${{ inputs.changelog }}
          INPUT_CONFIRM: ${{ inputs.publish_confirm }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_BODY: ${{ github.event.release.body }}
          RELEASE_PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" && "$INPUT_CONFIRM" != "PUBLISH" ]]; then
            printf 'Publish Confirmation Is Required\n' >&2
            exit 1
          fi
          if [[ "$GITHUB_EVENT_NAME" == "release" ]]; then
            version=${RELEASE_TAG#resync-}
            version=${version#v}
            channel=stable
            [[ "$RELEASE_PRERELEASE" == "true" ]] && channel=dev
            visibility=PUBLIC
            changelog=$RELEASE_BODY
            source_ref=$RELEASE_TAG
          else
            version=$INPUT_VERSION
            channel=$INPUT_CHANNEL
            visibility=$INPUT_VISIBILITY
            changelog=$INPUT_CHANGELOG
            source_ref=$GITHUB_REF
          fi
          if [[ ${#version} -gt 64 || ! "$version" =~ ^[0-9]+([.][0-9A-Za-z]+|[-+_][0-9A-Za-z]+)*$ ]]; then
            printf 'Release Version Is Invalid: %s\n' "$version" >&2
            exit 1
          fi
          delimiter="RESTUDIO_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}"
          {
            printf 'version=%s\n' "$version"
            printf 'channel=%s\n' "$channel"
            printf 'visibility=%s\n' "$visibility"
            printf 'source_ref=%s\n' "$source_ref"
            printf 'changelog<<%s\n%s\n%s\n' "$delimiter" "$changelog" "$delimiter"
          } >> "$GITHUB_OUTPUT"
      - id: dependencies
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.REPROJECTS_PAT }}
        run: |
          resolve() {
            local repository=$1
            local output=$2
            local branch
            branch=$(gh api "repos/$repository" --jq '.default_branch')
            printf '%s=%s\n' "$output" "$(gh api "repos/$repository/commits/$branch" --jq '.sha')" >> "$GITHUB_OUTPUT"
          }
          resolve ReStudioMC/Remotely remotely
          resolve RedxAx/ReScreen rescreen
          resolve RedxAx/Rebase rebase

  build:
    needs: prepare
    runs-on: [self-hosted, node1, linux, release]
    env:
      GRADLE_USER_HOME: /var/cache/restudio-gradle
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: ReProjects/ReSync
          ref: ${{ needs.prepare.outputs.source_ref }}
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ReStudioMC/Remotely
          token: ${{ secrets.REPROJECTS_PAT }}
          path: ReProjects/Remotely
          ref: ${{ needs.prepare.outputs.remotely_ref }}
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: RedxAx/ReScreen
          token: ${{ secrets.REPROJECTS_PAT }}
          path: ReProjects/ReScreen
          ref: ${{ needs.prepare.outputs.rescreen_ref }}
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: RedxAx/Rebase
          token: ${{ secrets.REPROJECTS_PAT }}
          path: ReProjects/Rebase
          ref: ${{ needs.prepare.outputs.rebase_ref }}
      - name: Build ReSync
        working-directory: ReProjects/ReSync
        shell: bash
        run: |
          chmod +x gradlew
          flock /var/lock/restudio-release-build.lock ./gradlew "-PreleaseVersion=$RELEASE_VERSION" shadowJar verifyUniversalJar --no-daemon --stacktrace
          install -d release-artifacts
          artifact=$(find build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*-sources.jar' ! -name '*-javadoc.jar' -print -quit)
          [[ -n "$artifact" ]] || { printf 'ReSync Jar Was Not Created\n' >&2; exit 1; }
          cp "$artifact" "release-artifacts/ReSync-$RELEASE_VERSION.jar"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: resync-universal
          path: ReProjects/ReSync/release-artifacts/*.jar
          if-no-files-found: error
          retention-days: 30

  publish:
    needs: [prepare, build]
    runs-on: [self-hosted, node1, linux, release]
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: resync-universal
          path: artifacts
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: RedxAx/ReStudio
          token: ${{ secrets.REPROJECTS_PAT }}
          path: release-tools
          ref: 78d63bab135fc1819ea3f4b0f3b48d20b2e5b122
      - name: Publish ReSync
        shell: bash
        env:
          RELEASE_CHANGELOG: ${{ needs.prepare.outputs.changelog }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          RELEASE_CHANNEL: ${{ needs.prepare.outputs.channel }}
          RELEASE_VISIBILITY: ${{ needs.prepare.outputs.visibility }}
        run: |
          chmod +x release-tools/scripts/releases/publish-release.sh
          artifact="artifacts/ReSync-$RELEASE_VERSION.jar"
          [[ -s "$artifact" ]] || { printf 'Release Artifact Is Missing Or Empty: %s\n' "$artifact" >&2; exit 1; }
          release-tools/scripts/releases/publish-release.sh "$artifact" resync "$RELEASE_VERSION" "$RELEASE_CHANNEL" universal "$RELEASE_VISIBILITY"
