name: Release ReSync

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: Release Version
        required: true
        type: string
      channel:
        description: Release Channel
        required: true
        type: choice
        default: stable
        options: [stable, dev]
      visibility:
        description: Release Visibility
        required: true
        type: choice
        default: PUBLIC
        options: [PUBLIC, UNLISTED]
      changelog:
        description: Release Changelog
        required: false
        type: string
      publish_confirm:
        description: Type PUBLISH To Release
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.repository }}-${{ github.event.release.tag_name || inputs.version }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
      channel: ${{ steps.release.outputs.channel }}
      visibility: ${{ steps.release.outputs.visibility }}
      changelog: ${{ steps.release.outputs.changelog }}
      source_ref: ${{ steps.release.outputs.source_ref }}
    steps:
      - id: release
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_CHANNEL: ${{ inputs.channel }}
          INPUT_VISIBILITY: ${{ inputs.visibility }}
          INPUT_CHANGELOG: ${{ inputs.changelog }}
          INPUT_CONFIRM: ${{ inputs.publish_confirm }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_BODY: ${{ github.event.release.body }}
          RELEASE_PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" && "$INPUT_CONFIRM" != "PUBLISH" ]]; then
            printf 'Publish Confirmation Is Required\n' >&2
            exit 1
          fi
          if [[ "$GITHUB_EVENT_NAME" == "release" ]]; then
            version=${RELEASE_TAG#resync-}
            version=${version#v}
            channel=stable
            [[ "$RELEASE_PRERELEASE" == "true" ]] && channel=dev
            visibility=PUBLIC
            changelog=$RELEASE_BODY
            source_ref=$RELEASE_TAG
          else
            version=$INPUT_VERSION
            channel=$INPUT_CHANNEL
            visibility=$INPUT_VISIBILITY
            changelog=$INPUT_CHANGELOG
            source_ref=$GITHUB_REF
          fi
          delimiter="RESTUDIO_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}"
          {
            printf 'version=%s\n' "$version"
            printf 'channel=%s\n' "$channel"
            printf 'visibility=%s\n' "$visibility"
            printf 'source_ref=%s\n' "$source_ref"
            printf 'changelog<<%s\n%s\n%s\n' "$delimiter" "$changelog" "$delimiter"
          } >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    runs-on: [self-hosted, node1, linux, release]
    env:
      GRADLE_USER_HOME: /var/cache/restudio-gradle
    steps:
      - uses: actions/checkout@v4
        with:
          path: ReProjects/ReSync
          ref: ${{ needs.prepare.outputs.source_ref }}
      - id: refs
        working-directory: ReProjects/ReSync
        shell: bash
        run: |
          lock=.restudio/workspace.lock.json
          for project in ReScreen Rebase; do
            printf '%s=%s\n' "${project,,}" "$(jq -r --arg project "$project" '.[$project]' "$lock")" >> "$GITHUB_OUTPUT"
          done
      - uses: actions/checkout@v4
        with:
          repository: RedxAx/ReScreen
          token: ${{ secrets.REPROJECTS_PAT }}
          path: ReProjects/ReScreen
          ref: ${{ steps.refs.outputs.rescreen }}
      - uses: actions/checkout@v4
        with:
          repository: RedxAx/Rebase
          token: ${{ secrets.REPROJECTS_PAT }}
          path: ReProjects/Rebase
          ref: ${{ steps.refs.outputs.rebase }}
      - name: Build ReSync
        working-directory: ReProjects/ReSync
        shell: bash
        run: |
          chmod +x gradlew
          flock /var/lock/restudio-release-build.lock ./gradlew -PreleaseVersion=${{ needs.prepare.outputs.version }} shadowJar verifyUniversalJar --no-daemon --stacktrace
          install -d release-artifacts
          artifact=$(find build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*-sources.jar' ! -name '*-javadoc.jar' -print -quit)
          [[ -n "$artifact" ]] || { printf 'ReSync Jar Was Not Created\n' >&2; exit 1; }
          cp "$artifact" "release-artifacts/ReSync-${{ needs.prepare.outputs.version }}.jar"
      - uses: actions/upload-artifact@v4
        with:
          name: resync-universal
          path: ReProjects/ReSync/release-artifacts/*.jar
          if-no-files-found: error
          retention-days: 30

  publish:
    needs: [prepare, build]
    runs-on: [self-hosted, node1, linux, release]
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: resync-universal
          path: artifacts
      - uses: actions/checkout@v4
        with:
          repository: RedxAx/ReStudio
          token: ${{ secrets.REPROJECTS_PAT }}
          path: release-tools
          ref: master
      - name: Publish ReSync
        shell: bash
        env:
          RELEASE_CHANGELOG: ${{ needs.prepare.outputs.changelog }}
        run: |
          chmod +x release-tools/scripts/releases/publish-release.sh
          release-tools/scripts/releases/publish-release.sh "artifacts/ReSync-${{ needs.prepare.outputs.version }}.jar" resync "${{ needs.prepare.outputs.version }}" "${{ needs.prepare.outputs.channel }}" universal "${{ needs.prepare.outputs.visibility }}"
