name: ReSync
version: '${version}'
main: restudio.resync.ReSync
api-version: '1.21'
prefix: ReSync
authors: [RedxAx]
description: Game Engine for Minecraft
softdepend:
  - PlaceholderAPI
  - Vault
  - LuckPerms
  - ProtocolLib
  - Nexo
permissions:
  resync.api.access:
    description: Allows API access to ReSync from Remotely
    default: op
  resync.command:
    description: Allows use of /resync command
    default: op
commands:
  resync:
    description: Manage ReSync systems
    usage: /resync <scoreboard|tab|world|portal|flow|item|resource|npc|village> ...
    permission: resync.command
