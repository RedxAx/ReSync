name: ReSync
version: '${version}'
main: restudio.resync.ReSync
api-version: '1.21'
prefix: ReSync
authors: [RedxAx]
description: Game Engine for Minecraft
softdepend:
  - PlaceholderAPI
  - Vault
  - LuckPerms
  - ProtocolLib
  - Nexo
permissions:
  resync.api.access:
    description: Allows API access to ReSync from Remotely
    default: op
  resync.command:
    description: Allows use of /resync command
    default: op
  resync.authority.export:
    description: Allows exporting the production authority bundle
    default: false
  resync.authority.anchor:
    description: Allows exporting the production authority trust anchor
    default: false
  resync.authority.grant:
    description: Allows issuing signed authority use grants
    default: false
commands:
  resync:
    description: Manage ReSync systems
    usage: /resync <status|network|authority|scoreboard|tab|world|portal|flow|item|resource|npc|trade> ...
