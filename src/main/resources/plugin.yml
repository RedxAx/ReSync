name: ReSync
version: '${version}'
main: restudio.resync.ReSync
api-version: '1.21'
prefix: ReSync
authors: [RedxAx, DumbFridge]
description: High-performance data synchronizer for Remotely - v2
softdepend:
  - PlaceholderAPI
permissions:
  resync.api.access:
    description: Allows API access to ReSync from Remotely
    default: op
  resync.command:
    description: Allows use of /resync command
    default: op
commands:
  resync:
    description: Manage ReSync scoreboard outputs
    usage: /resync <scoreboard|tab> ...
    permission: resync.command
